# SPA + reverse proxy to the FastAPI backend.
# Mirrors the Vite dev-server proxy in vite.config.ts so dev and prod behave
# the same: the SPA always calls `/api/*` and nginx or Vite handles routing.

server {
    listen 80;
    server_name _;

    # Static SPA assets.
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy: /api/<path> -> http://backend:8000/<path>
    # Strip the /api prefix so the backend mounts at root.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts forgiving enough for longer-running endpoints such as
        # pipeline runs that trigger Flex pulls.
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # SPA fallback - every non-asset path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not ship server tokens.
    server_tokens off;
}
